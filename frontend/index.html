<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocStream</title>
    <style>
      /* Minimal styles for the instant preloader (visible before app bundle loads) */
      #preloader {position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffffff,#f2f6ff);z-index:99999}
      #preloader span{color:#0b6eff;font:700 2.25rem Arial,sans-serif;letter-spacing:.02em;animation:prewiggle 1.6s infinite}
      @keyframes prewiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
    </style>
  </head>
  <body>
    <div id="preloader">
      <span>DocStream</span>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(() => {
        document.getElementById('preloader')?.remove()
      }, 2000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
