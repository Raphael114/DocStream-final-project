<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="1" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect rx="24" width="100%" height="100%" fill="url(#g1)" opacity="0.12" />

  <!-- abstract shapes -->
  <g transform="translate(40,30)">
    <circle cx="160" cy="140" r="110" fill="url(#g2)" opacity="0.18" />
    <rect x="360" y="40" width="280" height="200" rx="30" fill="#fff" opacity="0.95" />

    <!-- doctor illustration (simple) -->
    <g transform="translate(420,100)">
      <circle cx="32" cy="30" r="28" fill="#fbd5d5" />
      <rect x="-6" y="64" width="76" height="86" rx="18" fill="#fff" stroke="#fde68a" stroke-width="2" />
      <rect x="6" y="74" width="52" height="12" rx="6" fill="#60a5fa" />
      <circle cx="24" cy="18" r="5" fill="#1f2937" />
      <circle cx="40" cy="18" r="5" fill="#1f2937" />
    </g>

    <!-- a stethoscope symbol -->
    <g transform="translate(90,220) scale(1.05)">
      <path d="M12 4c0 2-2 4-4 4s-4-2-4-4" stroke="#374151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
      <path d="M6 36v22" stroke="#374151" stroke-width="4" stroke-linecap="round" />
      <circle cx="6" cy="62" r="10" stroke="#374151" stroke-width="3" fill="#fff" />
    </g>
  </g>

  <!-- floating pills -->
  <g transform="translate(520,260) rotate(-15)">
    <rect x="0" y="0" rx="14" width="40" height="18" fill="#fff" opacity="0.9" />
    <rect x="2" y="2" rx="12" width="36" height="14" fill="url(#g1)" />
  </g>

</svg>
