<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <!-- Icon: remote medical + streaming -->
  <g transform="translate(40,40)">
    <!-- Outer streaming waves -->
    <path d="M180 20c-40 0-72 32-72 72" fill="none" stroke="#0B6EFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M180 55c-18 0-32 14-32 32" fill="none" stroke="#0B6EFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

    <!-- Stethoscope -->
    <path d="M110 150c14-34 48-58 86-58 52 0 94 42 94 94 0 30-14 56-36 72-17 13-40 14-58 2l-2-1c-17-12-24-34-15-54 7-18 26-28 46-26 12 1 23 7 30 17" 
      fill="none" stroke="#0B6EFF" stroke-width="10" stroke-linecap="round"/>

    <!-- Stethoscope chest piece -->
    <g transform="translate(255,175)">
      <circle cx="0" cy="0" r="26" fill="#0B6EFF"/>
      <circle cx="0" cy="0" r="14" fill="white"/>
      <rect x="-7" y="26" width="14" height="22" rx="7" fill="#0B6EFF"/>
    </g>

    <!-- Small detail dot -->
    <circle cx="70" cy="22" r="7" fill="#0B6EFF" opacity="0.9"/>
  </g>

  <!-- Text: DocStream -->
  <text x="350" y="150" font-family="Inter, Arial, sans-serif" font-size="80" font-weight="700" fill="#0B6EFF">
    DocStream
  </text>

  <!-- Decorative underline -->
  <path d="M340 165 C 450 200, 620 200, 780 165" 
        fill="none" stroke="#0B6EFF" stroke-width="8" opacity="0.15" stroke-linecap="round"/>
</svg>
